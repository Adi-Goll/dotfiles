# remap prefix from 'C-b' to 'C-Space'
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

set -g mouse on

bind r source-file ~/.dotfiles/.tmux.conf

# --- Status bar ---
set -g status-position top

set -g status-justify left
set -g status-style "bg=default,fg=colour245"

set -g status-left ""
set -g status-left-length 0

setw -g window-status-current-format " #I  #W "
setw -g window-status-current-style "bg=colour97,fg=colour255,bold"

setw -g window-status-format " #I  #W "
setw -g window-status-style "bg=colour238,fg=colour255,bold"

set -g message-style "fg=colour255,bg=colour97,fill=colour97"
